services:
  - type: web
    name: event-hub-mail-worker
    runtime: docker
    
    # Free web services block outbound SMTP ports 25/465/587.
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: MAIL_WORKER_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
