name: Visual regression

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/visual/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/visual.yml"
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium

      # Детерминированные ассерты для карточек: градиент, line-clamp, высота.
      # Запускаем первым шагом — если падает, сразу видна суть регрессии,
      # без необходимости разглядывать диффы скриншотов.
      - name: Cards — CSS assertions (gradient / line-clamp / height)
        run: bunx playwright test tests/visual/cards.assert.spec.ts --workers=2

      # Пиксельные снапшоты (карточки + центрирование).
      - name: Visual snapshots
        run: bunx playwright test --workers=2 --ignore-snapshots=false

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
